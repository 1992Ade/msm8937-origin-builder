name: Build MSM8937 Kernel with OriginSU

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip repo

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/Mi-Thorium/kernel_msm-4.19 -b mithorium/a13/master kernel_source

      - name: Automatic Integration of OriginSU
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/samakshkambxj/OriginSU/main/kernel/setup.sh" | bash -

      - name: Configure Kernel Options & Fix Missing Staging Driver
        run: |
          cd kernel_source
          
          # 1. Neutraliser la référence au dossier 'prima' manquant dans drivers/staging/Kconfig
          if [ -f "drivers/staging/Kconfig" ]; then
            sed -i '/source "drivers\/staging\/prima\/Kconfig"/d' drivers/staging/Kconfig
            sed -i '/prima/d' drivers/staging/Kconfig || true
          fi

          # 2. Injecter CONFIG_KSU et CONFIG_KPM dans le defconfig GKI
          DEFCONFIG_PATH="arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
          fi

      - name: Build GKI Kernel
        run: |
          cd kernel_source
          
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"
          
          # Lancement de la compilation GKI
          BUILD_CONFIG=build.config.gki.aarch64 ./build/build.sh

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          OUT_DIR=$(pwd)/kernel_source/out
          if [ -d "$OUT_DIR" ]; then
            find "$OUT_DIR" -name "Image.gz-dtb" -exec cp {} anykernel/ \; || true
            find "$OUT_DIR" -name "Image.gz" -exec cp {} anykernel/ \; || true
            find "$OUT_DIR" -name "Image" -exec cp {} anykernel/ \; || true
          else
            cp kernel_source/out/*/arch/arm64/boot/Image* anykernel/ 2>/dev/null || true
          fi
          
          cd anykernel
          zip -r9 ../MSM8937-OriginSU-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSM8937-OriginSU-Kernel
          path: MSM8937-OriginSU-Kernel.zip
