name: Build MSM8937 Kernel with OriginSU

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/Mi-Thorium/kernel_msm-4.19 -b mithorium/a13/master kernel_source

      - name: Automatic Integration of OriginSU
        run: |
          cd kernel_source
          curl -LSs "https://raw.githubusercontent.com/samakshkambxj/OriginSU/main/kernel/setup.sh" | bash -

      - name: Download Clang Toolchain & GCC Prefixes
        run: |
          # Toolchain Clang AOSP
          git clone --depth=1 https://gitlab.com/sarthakroy2002/clang-r416183b.git clang
          # Cross-compilateurs GCC requis par Clang pour l'architecture 64/32-bit
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Build Kernel with Clang
        run: |
          cd kernel_source
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Configuration des chemins d'accès
          export PATH="$(pwd)/../clang/bin:$(pwd)/../gcc64/bin:$(pwd)/../gcc32/bin:$PATH"
          
          # Variables de compilation Clang pour le noyau Linux
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Génération du defconfig
          make gki_defconfig
          
          # Activation d'OriginSU et KPM
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KPM=y" >> .config
          
          # Compilation
          make -j$(nproc --all) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "kernel_source/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel_source/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f "kernel_source/arch/arm64/boot/Image.gz" ]; then
            cp kernel_source/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "kernel_source/arch/arm64/boot/Image" ]; then
            cp kernel_source/arch/arm64/boot/Image anykernel/
          fi
          
          cd anykernel
          zip -r9 ../MSM8937-OriginSU-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSM8937-OriginSU-Kernel
          path: MSM8937-OriginSU-Kernel.zip
